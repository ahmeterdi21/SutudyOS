name: Bug report / Hata bildirimi
description: Report a StudyOS issue in English or Turkish.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "English and Turkish are welcome. Please omit personal files, passwords and signing keys. / İngilizce veya Türkçe yazabilirsiniz. Kişisel dosya, parola ve imza anahtarı paylaşmayın."
  - type: input
    id: version
    attributes:
      label: StudyOS version / StudyOS sürümü
      placeholder: "e.g. v0.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows sürümü
      placeholder: "e.g. Windows 11, x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Tekrar etme adımları
      placeholder: "1. Open ... 2. Select ... / 1. ... bölümünü açın. 2. ... seçin."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / Beklenen ve gerçekleşen davranış
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error message or screenshot / Hata mesajı veya ekran görüntüsü
      description: "Hide personal information first. / Önce kişisel bilgileri gizleyin."
