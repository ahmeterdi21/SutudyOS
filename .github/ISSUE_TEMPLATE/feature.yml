name: Feature request / Özellik önerisi
description: Share an idea in English or Turkish.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: What need should this address? / Hangi ihtiyacı karşılasın?
      placeholder: "Describe what you are trying to do. / Yapmak istediğiniz işi anlatın."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / Önerilen çözüm
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples or alternatives / Örnek veya alternatif
      description: "You can include a sketch, screenshot or link. / Çizim, ekran görüntüsü veya bağlantı ekleyebilirsiniz."
